# Configuracion del Observatorio de Inteligencia Turistica - Lago de Atitlan (Grupo 3).
# Rutas relativas a la raiz del repositorio. La carpeta de datos se puede cambiar con la
# variable de entorno OBS_DATOS (en Docker se monta desde el equipo, nunca se copia a la imagen).

destino:
  nombre: Lago de Atitlán
  departamento: Sololá

rutas:
  # Datos reales (institucionales). NO se versionan (.gitignore).
  datos: data/raw
  # Datos sinteticos con la misma estructura, generados con scripts/generar_sinteticos.py
  sinteticos: data/sinteticos
  # Salida del ETL: tablas limpias en parquet que lee el tablero
  procesados: data/procesados

# Archivos de entrada. `patron` admite comodines para tolerar variaciones de nombre.
fuentes:
  migracion:
    patron: "Base_Migracion*.xlsx"
    hoja: Datos
  movilidad_mensual:
    patron: "*movi*dad*mensual*.xlsx"  # el archivo oficial se llama BD_moviidad_mensual.xlsx
    hoja: Atitlan
  movilidad_diaria:
    patron: "*movi*dad*diari*.xlsx"    # idem: BD_moviidad_diario.xlsx
    hoja: Atitlan
  ocupacion:
    patron: "indice_ocupacion_mensual*.csv"
  oferta:
    patron: "oferta_hotelera*.csv"
  # --- Fuentes opcionales de la asignacion (si faltan, el tablero lo indica y sigue funcionando) ---
  # Boletines anuales de ocupacion hotelera (PDF): se extrae, con codigo, el movimiento hotelero
  # mensual del departamento por residencia (huespedes y noches). Esa desagregacion NO esta en el CSV
  # de ocupacion; la ocupacion del boletin solo se usa para verificar el CSV.
  boletines:
    patron: "BOLETIN*OCUPACION*.pdf"
    opcional: true
  # Encuesta de perfil del visitante en puestos fronterizos (parquet sin extension). Solo se
  # conservan agregados de quienes declaran como destino el lago; sin factor de expansion.
  frontera:
    patron: "BD_COMPLEMENTARIA*"
    opcional: true
    destino_declarado: "Lago Atitlán"

# Valor de `pais` que identifica a los visitantes nacionales (incorporan factor de expansion)
pais_nacional: Guatemala

# Periodos sin cobertura de telefonia que se estiman (rule: nunca se muestran como cero)
estimacion:
  meses_sin_cobertura: ["2026-01", "2026-02"]
  # Anios de migracion con los que se construye el perfil estacional (metodo A)
  anios_perfil: [2023, 2024, 2025]
  # Tipos de viajero de la base de migracion que se consideran visitantes
  tipos_migracion: [Turista, Excursionista]

# Ventana en la que coinciden afluencia (telefonia) y ocupacion hotelera
ventana_coincidente: ["2025-09", "2025-12"]
